name: Unzip project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip and commit
        run: |
          ZIP=$(ls *.zip 2>/dev/null | head -1)
          if [ -z "$ZIP" ]; then echo "::error::No .zip file found in the repository root. Upload roohani-dhaal-github-ready.zip first."; exit 1; fi
          # GitHub does not let the default token push files under .github/workflows,
          # so those two files are skipped here and must be added by hand.
          unzip -o "$ZIP" -x ".github/*"
          rm -f "$ZIP"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project files"
          git push
