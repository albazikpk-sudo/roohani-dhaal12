name: Create Keystore (run ONCE)

on:
  workflow_dispatch:

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate release keystore
        run: |
          P=$(openssl rand -hex 16); echo "::add-mask::$P"
          keytool -genkeypair -keystore roohani-release.keystore -alias roohani -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$P" -keypass "$P" -dname "CN=Mufti Muhammad Sohail Al-Bazi, O=Roohani Dhaal, C=PK"
          {
            echo "KEYSTORE_PASSWORD=$P"
            echo "KEY_ALIAS=roohani"
            echo "KEY_PASSWORD=$P"
            echo "KEYSTORE_BASE64=$(base64 -w0 roohani-release.keystore)"
          } > github-secrets.txt
      - uses: actions/upload-artifact@v4
        with:
          name: KEEP-PRIVATE-keystore-and-secrets
          path: |
            roohani-release.keystore
            github-secrets.txt
          retention-days: 1
